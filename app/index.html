<!doctype html>
<html lang="en" data-theme="dark" data-accent="mint">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f1113" />
    <script>
      // Applies the stored theme before any stylesheet or bundle loads, so a
      // reload never flashes the wrong background. Keys and background values
      // must match src/theme/index.ts and src/theme/theme.css.
      (function () {
        var mode = 'dark', accent = 'mint';
        try {
          mode = localStorage.getItem('vacuula.theme') || mode;
          accent = localStorage.getItem('vacuula.accent') || accent;
        } catch (e) {}
        if (mode !== 'light') mode = 'dark';
        var bg = mode === 'light' ? '#f4f6f5' : '#0f1113';
        var html = document.documentElement;
        html.setAttribute('data-theme', mode);
        html.setAttribute('data-accent', accent);
        html.style.backgroundColor = bg;
        html.style.colorScheme = mode;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon-vacuula.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vacuula</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
