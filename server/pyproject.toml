[project]
name = "vacuula-server"
version = "1.0.0"
description = "Install Vacuula on your Neato robot"
readme = "../README.md"
authors = [
    {   name = "Philip", email = "philipmagyar@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "greenlet==3.5.1",
    "ifaddr==0.2.0",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "numpy==2.4.6",
    "pillow==12.2.0",
    "sqlalchemy==2.0.50",
    "typing-extensions==4.15.0",
    "tzdata==2026.5",
    "tzlocal==5.4.4",
    "zeroconf==0.151.3",
]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
extend-exclude = ["data", "data-dev", "web"]