# config for Home Assistant add-on
name: Vacuula
version: "1.0.0-b21" # temporary until release
slug: vacuula
description: custom server for the undead robot vacuum cleaners - revive your Neato with the power of Vacuula
url: "https://github.com/vacuula/vacuula"
arch:
  - aarch64
  - amd64
init: false
host_network: true
boot: auto
image: "ghcr.io/vacuula/vacuula"

map:
  - type: addon_config
    read_only: false
    path: /server/data

options:
  GEN4_PORT: 3443
  VACUULA_PORT: 80
  GEN3_ENABLED: true
  GEN4_ENABLED: true
  MDNS_ENABLED: true

schema:
  GEN4_PORT: int
  VACUULA_PORT: int
  GEN3_ENABLED: bool
  GEN4_ENABLED: bool
  MDNS_ENABLED: bool